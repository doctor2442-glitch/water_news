<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>상하수도 뉴스 브리핑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
/* Layout: 관측소 일지 — 상단 전국 개황, 지역 탭 줄, 선택 지역의 보고서(좌) + 기사 목록(우), 좁은 화면에선 한 줄로 */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --ink:#132429; --muted:#566A70; --line:#D6E0E1;
  --accent:#0B6E66; --accent-soft:#DDEEEB; --warn:#A8560B; --warn-soft:#F6E8D8;
  --f-display:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1719; --surface:#152225; --ink:#E3ECEC; --muted:#93A6AA; --line:#26373A;
  --accent:#4CC2B2; --accent-soft:#17332F; --warn:#E3A25C; --warn-soft:#3A2A19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1719; --surface:#152225; --ink:#E3ECEC; --muted:#93A6AA; --line:#26373A;
  --accent:#4CC2B2; --accent-soft:#17332F; --warn:#E3A25C; --warn-soft:#3A2A19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.eyebrow{font-family:var(--f-data);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.4vw,40px);line-height:1.2;margin:0;text-wrap:balance}
.status{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

.overview{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
.overview h2,.report h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 8px}
.overview p{margin:0 0 10px;max-width:65ch}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .lbl{font-family:var(--f-data);font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar{display:grid;grid-template-columns:52px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:13px;background:none;border:0;padding:2px 0;color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}
.bar .track{height:10px;background:var(--line);border-radius:2px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent)}
.bar .n{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
.bar:hover .fill{background:var(--ink)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{font-family:var(--f-body);font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab .c{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-pressed="true"] .c{color:var(--bg);opacity:.75}
.search{margin-left:auto;min-width:0;flex:0 1 220px}
.search input{width:100%;font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}

.main{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-items:start}
.report{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.report .meta{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.report p{margin:0}
.report h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:4px 0 0;font-weight:600}
.report ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.refresh{font:inherit;font-size:13px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:3px 12px;border-radius:999px;cursor:pointer;font-weight:600}
.refresh:disabled{opacity:.6;cursor:default}
.runlink{font-size:12px;color:var(--muted)}
.checked{font-size:12px;color:var(--muted)}
.copy,.pdf{align-self:flex-start;font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 12px;border-radius:4px;cursor:pointer}
.copy:hover,.pdf:hover{border-color:var(--ink)}
.pdf{border-color:var(--accent);color:var(--accent);font-weight:600}
.pdf:disabled{opacity:.5;cursor:default}

.feed{display:flex;flex-direction:column}
.feed-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.feed-head h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.feed-head .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.feed-head span{font-size:13px;color:var(--muted)}
.pdfmsg{font-size:12px;color:var(--muted)}
.item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding-block:16px;border-top:1px solid var(--line)}
.item time{font-family:var(--f-data);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.item .src{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.op{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.pill.focus{background:var(--accent);color:var(--surface)}
.item.is-focus{border-left:3px solid var(--accent);padding-left:12px}
.grp{font-family:var(--f-data);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:18px 0 0;padding-bottom:6px;font-weight:500}
.grp:first-child{margin-top:4px}
.grp b{color:var(--accent);font-weight:600}
.topics{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.topics button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:3px 10px;border-radius:999px;cursor:pointer}
.topics button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.focusbox{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.focusbox h3{margin:0;color:var(--accent)}
.focusbox p{margin:0}
.item h4{margin:2px 0 6px;font-size:16px;line-height:1.45;font-weight:600}
.item h4 a{color:var(--ink);text-decoration:none}
.item h4 a:hover{color:var(--accent);text-decoration:underline}
.item p{margin:0;color:var(--ink);max-width:65ch}
.figs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fig{font-family:var(--f-data);font-size:12px;border:1px solid var(--line);padding:1px 8px;border-radius:3px;color:var(--muted);font-variant-numeric:tabular-nums}

.empty{padding:28px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:left}
.note{font-size:13px;color:var(--warn)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* PDF 렌더용 화면 밖 레이아웃 (항상 밝은 색) */
#pdfStage{position:fixed;left:-10000px;top:0;width:720px;background:#fff;color:#132429;font-family:var(--f-body);font-size:14px;line-height:1.65}
#pdfStage .blk{padding:10px 0;background:#fff}
#pdfStage h1{font-family:var(--f-display);font-size:26px;margin:0 0 4px;color:#132429}
#pdfStage .sub{color:#566A70;font-size:12px;border-bottom:2px solid #132429;padding-bottom:10px}
#pdfStage h2{font-size:17px;margin:4px 0 6px}
#pdfStage h3{font-size:15px;margin:2px 0 4px}
#pdfStage p{margin:0 0 6px}
#pdfStage ul{margin:0;padding-left:18px}
#pdfStage .it{border-top:1px solid #D6E0E1}
#pdfStage .m{color:#566A70;font-size:11px}
#pdfStage .f{color:#0B6E66;font-size:11px}
#pdfStage .u{color:#566A70;font-size:10px;word-break:break-all}

@media (max-width:820px){
  .overview,.main{grid-template-columns:minmax(0,1fr)}
  .report{position:static}
  .search{flex-basis:100%;margin-left:0}
  .item{grid-template-columns:minmax(0,1fr);gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow"><span>전국 지역별 클리핑</span><span>상하수도 전반 · 중점 개인하수처리시설</span></div>
    <h1>상하수도 뉴스 브리핑</h1>
    <div class="status" id="status"><span><span class="dot"></span>데이터를 불러오는 중입니다</span></div>
  </header>

  <section class="overview" aria-label="전국 개황">
    <div>
      <h2>전국 개황</h2>
      <div id="overall"><p class="empty">매일 오전 8시(한국시간)에 전국 언론의 상하수도 기사를 모아 이곳에 전국 요약을 씁니다.</p></div>
    </div>
    <div class="bars" id="bars" aria-label="지역별 기사 수"><span class="lbl">지역별 기사 수</span></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="지역 선택"></nav>

  <section class="main">
    <article class="report" id="report" aria-live="polite" hidden></article>
    <div class="feed">
      <div class="feed-head"><h2 id="feedTitle">기사</h2><div class="r"><div class="topics" id="topics" role="group" aria-label="주제 선택"><button type="button" data-t="전체" aria-pressed="true">전체</button><button type="button" data-t="개인하수" aria-pressed="false">개인하수처리시설</button><button type="button" data-t="일반" aria-pressed="false">상하수도 일반</button></div><span id="feedCount"></span><button class="pdf" type="button" id="pdfBtn" hidden>PDF로 받기</button><span class="pdfmsg" id="pdfMsg" aria-live="polite"></span></div></div>
      <div id="list"></div>
    </div>
  </section>

  <footer>매일 오전 7시 50분(KST)쯤 구글 뉴스 검색 결과에서 상하수도 기사를 자동으로 모읍니다. 제목과 지역명으로 분류하므로 일부 분류가 다를 수 있으니, 정확한 내용은 제목 링크로 원문을 확인하세요. 30일(제주는 6개월)이 지난 기사는 자동으로 정리합니다.</footer>
</div>
<div id="pdfStage" aria-hidden="true"></div>

<script>
(function(){
  const REGION_ORDER=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주","전국"];
  const ALWAYS=["제주"];
  const state={articles:[],reports:{},meta:null,region:"전체",q:"",loaded:false};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const WARN=/위반|부적합|초과|오염|처분|과태료|고발/;
  let downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
  const FOCUS_RE=/개인하수|개인 하수|오수처리시설|개인오수|정화조/;
  const isFocus=a=>a.focus===true||(a.focus!==false&&FOCUS_RE.test([a.title,a.summary,(a.tags||[]).join(" ")].join(" ")));
  state.topic="전체";

  function regions(){
    const counts={};
    ALWAYS.forEach(r=>counts[r]=0);
    state.articles.forEach(a=>{counts[a.region]=(counts[a.region]||0)+1});
    const list=Object.keys(counts).sort((a,b)=>{
      const ia=REGION_ORDER.indexOf(a),ib=REGION_ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib)});
    return {list,counts};
  }

  function fmtDate(d){return d?d.replace(/-/g,"."):"";}

  function renderStatus(){
    const m=state.meta;
    if(!state.loaded){return}
    const {list,counts}=regions();
    const parts=[];
    parts.push(`<span><span class="dot"></span>최근 갱신 <b>${esc(m?.lastRunText||"아직 없음")}</b></span>`);
    parts.push(`<span>다음 갱신 <b>매일 08:00 KST</b></span>`);
    parts.push(`<span>수집 기사 <b>${state.articles.length}</b>건 (개인하수처리시설 <b>${state.articles.filter(isFocus).length}</b>건)</span>`);
    parts.push(`<span>지역 <b>${list.filter(r=>counts[r]>0).length}</b>곳</span>`);
    parts.push(`<button class="refresh" type="button" id="refreshBtn">↻ 최신 내용 불러오기</button><a class="runlink" href="https://github.com/doctor2442-glitch/water_news/actions/workflows/collect.yml" target="_blank" rel="noopener" title="저장소 주인만 실행할 수 있습니다">지금 수집하기(관리자)</a><span class="checked" id="checked" aria-live="polite">${state.checkedAt?esc(state.checkedAt):""}</span>`);
    $("status").innerHTML=parts.join("");
    $("refreshBtn").onclick=()=>loadData(true);
  }

  function renderOverall(){
    const m=state.meta;
    if(m&&Array.isArray(m.overall)&&m.overall.length){
      $("overall").innerHTML=m.overall.map(p=>`<p>${esc(p)}</p>`).join("");
    }
    const {list,counts}=regions();
    const max=Math.max(1,...Object.values(counts));
    $("bars").innerHTML=`<span class="lbl">지역별 기사 수</span>`+list.map(r=>
      `<button class="bar" type="button" data-r="${esc(r)}" aria-label="${esc(r)} ${counts[r]}건 보기"><span>${esc(r)}</span><span class="track"><span class="fill" style="width:${(counts[r]/max*100).toFixed(1)}%"></span></span><span class="n">${counts[r]}</span></button>`).join("");
    $("bars").querySelectorAll(".bar").forEach(b=>b.onclick=()=>{state.region=b.dataset.r;renderAll();$("tabs").scrollIntoView({block:"start"})});
  }

  function renderTabs(){
    const {list,counts}=regions();
    const tabs=["전체",...list];
    const html=tabs.map(r=>`<button class="tab" type="button" data-r="${esc(r)}" aria-pressed="${state.region===r}">${esc(r)}<span class="c">${r==="전체"?state.articles.length:counts[r]}</span></button>`).join("")
      +`<label class="search"><input id="q" type="search" placeholder="기사 검색 (예: 정화조, 상수도)" value="${esc(state.q)}" aria-label="기사 검색"></label>`;
    $("tabs").innerHTML=html;
    $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.region=b.dataset.r;renderAll()});
    const q=$("q");
    q.oninput=()=>{state.q=q.value;renderList()};
  }

  function reportText(r){
    const fo=r.focus?(Array.isArray(r.focus)?r.focus:[r.focus]):[];
    const lines=[`[${r.region}] 하수·개인하수처리시설 보고`, `작성: ${r.updatedText||""}`, "", r.headline||"", "", ...(fo.length?["■ 개인하수처리시설 보고",...fo,""]:[]), "■ 상하수도 전반 동향", ...(r.body||[]), "", "주요 사항", ...(r.keyPoints||[]).map(k=>"- "+k)];
    if(r.outlook) lines.push("", "전망·시사점", r.outlook);
    return lines.join("\n");
  }

  function renderReport(){
    const el=$("report");
    const key=state.region==="전체"?"전국":state.region;
    const r=state.reports[key];
    if(!state.loaded){el.innerHTML=`<p class="empty">보고서를 불러오는 중입니다.</p>`;return}
    if(!r){el.innerHTML=`<h2>${esc(key)} 보고서</h2><p class="empty">이 지역의 새 기사가 들어오면 다음 갱신(매일 오전 8시) 때 보고서를 씁니다.</p>`;return}
    el.innerHTML=`
      <div class="meta">${esc(key)} 동향 보고 · ${esc(r.updatedText||"")} · 기사 ${r.count??"-"}건 기준</div>
      <h2>${esc(r.headline||key+" 보고서")}</h2>
      ${r.focus?`<div class="focusbox"><h3>개인하수처리시설 보고</h3>${(Array.isArray(r.focus)?r.focus:[r.focus]).map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
      ${r.body?.length?`<h3>상하수도 전반 동향</h3>`:""}
      ${(r.body||[]).map(p=>`<p>${esc(p)}</p>`).join("")}
      ${r.keyPoints?.length?`<h3>주요 사항</h3><ul>${r.keyPoints.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`:""}
      ${r.outlook?`<h3>전망·시사점</h3><p>${esc(r.outlook)}</p>`:""}
      <button class="copy" type="button" id="copyBtn">보고서 텍스트 복사</button>
      <textarea id="copyFallback" hidden readonly style="width:100%;min-height:160px;font:inherit;font-size:13px"></textarea>`;
    $("copyBtn").onclick=async()=>{
      const t=reportText({...r,region:key});
      try{await navigator.clipboard.writeText(t);$("copyBtn").textContent="복사했습니다"}
      catch(e){const ta=$("copyFallback");ta.hidden=false;ta.value=t;ta.select();$("copyBtn").textContent="아래 텍스트를 선택해 복사하세요"}
      setTimeout(()=>{const b=$("copyBtn");if(b)b.textContent="보고서 텍스트 복사"},2500);
    };
  }

  function currentItems(){
    const q=state.q.trim().toLowerCase();
    let items=state.articles.filter(a=>state.region==="전체"||a.region===state.region);
    if(state.topic==="개인하수") items=items.filter(isFocus);
    else if(state.topic==="일반") items=items.filter(a=>!isFocus(a));
    if(q) items=items.filter(a=>[a.title,a.summary,a.city,a.source,a.kind,a.author,(a.figures||[]).join(" ")].join(" ").toLowerCase().includes(q));
    items.sort((a,b)=>(isFocus(b)-isFocus(a))||(b.date||"").localeCompare(a.date||""));
    return items;
  }

  function renderPdfBtn(n){
    const b=$("pdfBtn");
    b.hidden=!downloads||!state.loaded;
    b.textContent=`${state.region==="전체"?"전체":state.region} 기사 PDF로 받기`;
    b.disabled=n===0;
  }

  function renderList(){
    const items=currentItems();
    $("feedTitle").textContent=state.region==="전체"?"전체 기사":`${state.region} 기사`;
    $("feedCount").textContent=`${items.length}건 · 개인하수처리시설 먼저`;
    document.querySelectorAll("#topics button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===state.topic)));
    renderPdfBtn(items.length);
    if(!state.loaded){$("list").innerHTML=`<p class="empty">기사를 불러오는 중입니다.</p>`;return}
    if(!items.length){$("list").innerHTML=`<p class="empty">${state.articles.length?"이 지역(또는 조건)에 맞는 최근 기사가 없습니다.":"아직 수집된 기사가 없습니다. 매일 오전 8시에 새 기사가 이곳에 쌓입니다."}</p>`;return}
    const fo=items.filter(isFocus),ge=items.filter(a=>!isFocus(a));
    const grp=(t,arr)=>arr.length?`<div class="grp">${t} <b>${arr.length}</b>건</div>`+arr.map(itemHtml).join(""):"";
    $("list").innerHTML=grp("개인하수처리시설",fo)+grp("상하수도 일반",ge);
  }
  function itemHtml(a){
      const warn=WARN.test(a.title+" "+(a.tags||[]).join(" "));
      const f=isFocus(a);
      return `<div class="item${f?" is-focus":""}">
        <time datetime="${esc(a.date)}">${esc(fmtDate(a.date))}</time>
        <div>
          <div class="src"><span class="pill${warn?" warn":""}">${esc(a.region)}${a.city&&a.city!==a.region?" · "+esc(a.city):""}</span>${f?`<span class="pill focus">개인하수</span>`:""}${a.kind==="기고"?`<span class="pill op">기고${a.author?" · "+esc(a.author):""}</span>`:""}<span>${esc(a.source)}</span>${(a.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join("")}</div>
          <h4><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h4>
          ${a.summary?`<p>${esc(a.summary)}</p>`:""}
          ${a.figures?.length?`<div class="figs">${a.figures.map(f=>`<span class="fig">${esc(f)}</span>`).join("")}</div>`:""}
        </div></div>`;
  }

  /* ---------- PDF ---------- */
  function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
  let libs=null;
  function loadLibs(){
    if(!libs) libs=Promise.all([
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]).catch(e=>{libs=null;throw e});
    return libs;
  }
  function todayStr(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10)}

  async function makePdf(){
    const btn=$("pdfBtn"),msg=$("pdfMsg");
    const items=currentItems();
    if(!items.length) return;
    const label=state.region==="전체"?"전체":state.region;
    const key=state.region==="전체"?"전국":state.region;
    const r=null;
    btn.disabled=true;msg.textContent="PDF를 만드는 중입니다…";
    try{
      await loadLibs();
      try{await document.fonts.ready}catch(e){}
      const stage=$("pdfStage");
      const blocks=[];
      blocks.push(`<div class="blk"><h1>${esc(label)} 상하수도 기사 모음</h1><div class="sub">상하수도 뉴스 브리핑 · ${esc(todayStr().replace(/-/g,"."))} 기준 · 기사 ${items.length}건 · 요약은 원문을 바탕으로 새로 쓴 것입니다</div></div>`);
      if(r){
        const fo=r.focus?(Array.isArray(r.focus)?r.focus:[r.focus]):[];
        blocks.push(`<div class="blk"><h2>${esc(r.headline||"")}</h2>${fo.length?`<h3 style="color:#0B6E66">개인하수처리시설 보고</h3>${fo.map(p=>`<p>${esc(p)}</p>`).join("")}`:""}</div>`);
        if(r.body?.length) blocks.push(`<div class="blk"><h3>상하수도 전반 동향</h3>${r.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`);
        if(r.keyPoints?.length) blocks.push(`<div class="blk"><h2>주요 사항</h2><ul>${r.keyPoints.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>${r.outlook?`<p style="margin-top:8px"><b>전망·시사점</b> ${esc(r.outlook)}</p>`:""}</div>`);
      }
      let lastF=null;
      items.forEach(a=>{const f=isFocus(a);if(f!==lastF){lastF=f;blocks.push(`<div class="blk"><h2>${f?"개인하수처리시설 기사":"상하수도 일반 기사"}</h2></div>`)}
        blocks.push(`<div class="blk it"><div class="m">${esc(fmtDate(a.date))}${a.kind==="기고"?" · [기고"+(a.author?" "+esc(a.author):"")+"]":""} · ${esc(a.source)}${a.city?" · "+esc(a.city):""}</div><h3>${esc(a.title)}</h3>${a.summary?`<p>${esc(a.summary)}</p>`:""}${a.figures?.length?`<div class="f">${a.figures.map(esc).join(" · ")}</div>`:""}<div class="u">${esc(a.url)}</div></div>`)});
      stage.innerHTML=blocks.join("");
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:"mm",format:"a4"});
      const PW=210,M=16,CW=PW-2*M,PH=297,BOT=PH-M;
      let y=M;
      for(const el of stage.children){
        const c=await window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false});
        const h=c.height*CW/c.width;
        if(y+h>BOT&&y>M){pdf.addPage();y=M}
        pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",M,y,CW,h);
        y+=h;
      }
      stage.innerHTML="";
      const blob=pdf.output("blob");
      await downloads.save({filename:`${label}_상하수도기사_${todayStr()}.pdf`,data:blob});
      msg.textContent="저장했습니다";
    }catch(e){
      const code=e&&e.code;
      msg.textContent=code==="declined"?"저장을 취소했습니다":code==="rate_limited"?"잠시 후 다시 눌러 주세요":code==="unavailable"||code==="not_granted"?"이 화면에서는 파일 저장을 쓸 수 없습니다":"PDF를 만들지 못했습니다. 잠시 후 다시 시도해 주세요";
    }finally{
      btn.disabled=false;setTimeout(()=>{if($("pdfMsg"))$("pdfMsg").textContent=""},4000);
    }
  }
  $("pdfBtn").onclick=makePdf;
  document.querySelectorAll("#topics button").forEach(b=>b.onclick=()=>{state.topic=b.dataset.t;renderList()});

  function renderAll(){renderStatus();renderOverall();renderTabs();renderList();}
  renderAll();

  async function loadData(manual){
    const btn=$("refreshBtn");
    if(btn){btn.disabled=true;btn.textContent="불러오는 중…"}
    const before=state.meta?.lastRunText;
    try{
      const res=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      const d=await res.json();
      state.articles=(d.articles||[]);
      const o={};(d.reports||[]).forEach(v=>{o[v.region||v.id]=v});state.reports=o;
      state.meta=d.meta||null;
      const t=new Date(Date.now()+9*3600e3).toISOString().slice(11,16);
      state.checkedAt=t+" 확인"+(manual?(before===state.meta?.lastRunText?" · 바뀐 내용 없음":" · 새 내용 반영"):"");
      state.loaded=true;renderAll();
    }catch(e){
      state.loaded=true;
      if(manual&&state.articles.length){renderAll();$("checked").textContent="불러오지 못했습니다. 잠시 후 다시 눌러 주세요"}
      else{$("status").innerHTML=`<span class="note">데이터 파일(data.json)을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</span>`;renderReport();renderList()}
    }
  }
  loadData(false);
})();
</script>

</body></html>
